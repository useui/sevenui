name: ci
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # 22.18, matching manifest-canary.yml's own pin (and its comment):
          # Task 8.2's build-md-mirrors script and lib/docs/serialize-md.ts's
          # off-graph load both import a relative .ts specifier with plain
          # `node`, no build step. Node only strips types from that shape
          # without a flag from 22.18.0 — below it, ERR_UNKNOWN_FILE_EXTENSION.
          # Keeping this at 22.12 would build green here while breaking on
          # every contributor machine and CI run that isn't already on 22.18+.
          node-version: 22.18
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm check:registry
      - run: pnpm test
      - run: pnpm build
        env:
          PRO_MANIFEST_URL: lib/pro-manifest.fixture.json
      # Not a live-manifest check — pnpm build, above, already stopped doing
      # that in Task 5.1, and this step must not reintroduce it. What this
      # exercises is scripts/check-pro-manifest.mjs's own ability to run: its
      # `import { icons } from "lucide-react"` resolves from scripts/, which
      # is not a package root, so it depends on lucide-react being declared
      # at the workspace root rather than hoisted there — a lockfile
      # regression can silently break just that import. The same offline
      # fixture pnpm build already uses above stands in for the live
      # manifest, so this is deterministic and needs no network. Before this
      # step existed, the only thing that ran this script at all was
      # manifest-canary.yml's scheduled job — which fires only from the
      # default branch, i.e. only after a breaking change has already
      # merged. This step catches it on the pull request instead.
      - run: node scripts/check-pro-manifest.mjs apps/web/lib/pro-manifest.fixture.json
      - run: pnpm test:smoke
