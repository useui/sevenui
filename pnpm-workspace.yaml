packages:
  - apps/*
  - packages/*

# Blume SSR prerender externalizes registry deps; hoist them so Node's ancestor walk from apps/web/dist can resolve them.
publicHoistPattern:
  - '@base-ui/react'
  - class-variance-authority
  - clsx
  - embla-carousel-react
  - lucide-react
  - react-day-picker
  - react-hook-form
  - react-is
  - react-resizable-panels
  - recharts
  - tailwind-merge

allowBuilds:
  '@scarf/scarf': false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  utf-8-validate: false

patchedDependencies:
  blume@1.5.3: patches/blume@1.5.3.patch
